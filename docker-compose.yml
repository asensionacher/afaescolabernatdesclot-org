services:
  db:
    image: postgres:16-alpine
    container_name: afa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afa
      POSTGRES_PASSWORD: afa
      POSTGRES_DB: afa
    ports:
      - '5432:5432'
    volumes:
      - afa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afa -d afa']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afa-pgdata:
